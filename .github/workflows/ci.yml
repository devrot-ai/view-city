name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11]
        node-version: [18]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Install backend package (editable)
        run: |
          python -m pip install -e backend

      - name: Run backend tests
        run: |
          pytest -q backend/tests

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install --legacy-peer-deps

      - name: Run frontend tests
        run: |
          cd frontend
          npm run test

      - name: Run frontend lint
        run: |
          cd frontend
          npm run lint

  e2e-tests:
    needs: build-and-test
    runs-on: ubuntu-latest
    services:
      frontend:
        image: node:18
        options: --workdir /github/workspace/frontend
        ports:
          - 5173:5173
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install frontend deps
        run: |
          cd frontend
          npm ci --legacy-peer-deps

      - name: Start frontend (background)
        run: |
          cd frontend
          npm run dev &
        continue-on-error: true

      - name: Wait for frontend
        run: |
          npx wait-on http://localhost:5173/ || sleep 1

      - name: Run Playwright E2E
        uses: microsoft/playwright-github-action@v1
        with:
          run: npx playwright test --config=frontend/playwright.config.ts

  publish-images:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/view-city-backend:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/view-city-backend:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/view-city-frontend:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/view-city-frontend:latest
